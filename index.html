<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERP Once</title>
<style>
:root{--fg:#111;--mut:#777;--bd:#e6e6e6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;background:#fff;color:var(--fg)}
main{max-width:640px;margin:auto;padding:20px 16px 60px}
h1{font-size:20px;font-weight:600;margin:0}
input,select,button{font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--fg);width:100%;margin:4px 0}
button{background:var(--fg);color:#fff;border:0;cursor:pointer;font-weight:500}
button.s{background:#fff;color:var(--fg);border:1px solid var(--bd)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
nav{display:flex;gap:18px;border-bottom:1px solid var(--bd);margin:14px 0;overflow-x:auto}
nav button{width:auto;background:none;color:var(--mut);border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 0;margin:0 0 -1px;white-space:nowrap}
nav button.on{color:var(--fg);border-color:var(--fg);font-weight:600}
.c{border-bottom:1px solid var(--bd);padding:12px 0}
.m{color:var(--mut);font-size:14px}
.t{font-weight:600}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r button{width:auto}
.g{display:flex;gap:8px}.g>*{flex:1}
summary{cursor:pointer}
#msg{font-size:14px;color:var(--mut);min-height:20px;margin-top:8px}
a.b{display:block;text-align:center;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;color:var(--fg);text-decoration:none;margin:6px 0}
@media(min-width:900px){
main{max-width:1120px}
.sh{display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:start}
.sd{position:sticky;top:20px}
nav{flex-direction:column;gap:2px;border:0;margin:20px 0}
nav button{text-align:left;padding:9px 12px;border:0;border-radius:8px;margin:0}
nav button.on{background:#f2f2f2}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;align-items:start}
}
</style>
</head>

<script>
const sb = supabase.createClient(
  'https://foxzcnctjohuqtoonpfb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZveHpjbmN0am9odXF0b29ucGZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MjA4NjMsImV4cCI6MjEwNjQ5Njg2M30.6F1Mf5hCYD_PWe1ZOSt_zY52t7oapGZRM3prwQkcZG4'
);
const $ = s => document.querySelector(s);
const S = { bid: null, bname: '', lists: [], tab: 'prod' };
const say = t => { $('#msg').textContent = t || ''; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Number(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const mon = c => c == 'USD' ? 'US$ ' : '$';
const MN = { ARS: 'Pesos argentinos (ARS)', USD: 'Dólares estadounidenses (USD)' };
const num = s => {
  s = String(s ?? '').trim().replace(/[$\s]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return s === '' ? '' : +s;
};

/* ---------- Acceso ---------- */
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  session ? load() : authView();
}
function authView() {
  $('#app').innerHTML = `<h1>ERP Once</h1>
    <input id="em" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="current-password">
    <button id="li">Ingresar</button><button class="s" id="su">Crear cuenta</button>`;
  $('#li').onclick = () => auth('signInWithPassword');
  $('#su').onclick = () => auth('signUp');
}
async function auth(fn) {
  say('Un momento…');
  const { data, error } = await sb.auth[fn]({ email: $('#em').value.trim(), password: $('#pw').value });
  if (error) return say(error.message);
  if (!data.session) return say('Te mandamos un mail: confirmá la cuenta y después ingresá.');
  say(); load();
}

/* ---------- Comercio ---------- */
async function load() {
  const { data, error } = await sb.from('members').select('business_id,businesses(name)').limit(1);
  if (error) return say(error.message);
  if (!data.length) return bizView();
  S.bid = data[0].business_id; S.bname = data[0].businesses.name;
  const l = await sb.from('price_lists').select('id,name,currency').eq('business_id', S.bid).order('name');
  S.lists = l.data || [];
  const w = await sb.from('warehouses').select('id').eq('business_id', S.bid).limit(1);
  S.wh = w.data?.[0]?.id;
  shell();
}
function bizView() {
  $('#app').innerHTML = `<h1>Creá tu comercio</h1><input id="bn" placeholder="Nombre del comercio"><button id="bc">Crear comercio</button>`;
  $('#bc').onclick = async () => {
    const name = $('#bn').value.trim();
    if (!name) return say('Escribí el nombre del comercio.');
    const { error } = await sb.rpc('create_business', { p_name: name });
    error ? say(error.message) : load();
  };
}
function shell() {
  const tabs = [['prod', 'Productos'], ['stock', 'Stock'], ['quo', 'Presupuestos'], ['ven', 'Ventas'], ['imp', 'Importar'], ['pre', 'Precios']];
  $('#app').innerHTML = `<div class="sh"><div class="sd"><div class="r"><h1>${esc(S.bname)}</h1><button class="s" id="out">Salir</button></div>
    <nav>${tabs.map(([k, n]) => `<button data-t="${k}" class="${S.tab == k ? 'on' : ''}">${n}</button>`).join('')}</nav></div><div id="v"></div></div>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); say(); authView(); };
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; say(); shell(); });
  ({ prod: prodView, stock: stockView, quo: quoView, ven: ventasView, imp: impView, pre: preView })[S.tab]();
}

/* ---------- Alta de productos (una o muchas filas) ---------- */
async function addProducts(rows) {
  const bid = S.bid; S.cat = null;
  const p = await sb.from('products').insert(rows.map(r => ({
    business_id: bid, code: r.code || null, name: r.name, cost: r.cost || 0, cost_currency: r.cc || 'ARS', units_per_pack: r.pack || 1
  }))).select('id');
  if (p.error) throw p.error;
  const v = await sb.from('product_variants').insert(p.data.map(x => ({ business_id: bid, product_id: x.id }))).select('id');
  if (v.error) throw v.error;
  const pr = [];
  rows.forEach((r, i) => {
    for (const [l, x] of Object.entries(r.prices)) {
      if (x !== '' && !isNaN(x)) pr.push({ business_id: bid, price_list_id: l, variant_id: v.data[i].id, price: +x });
    }
  });
  if (pr.length) { const e = await sb.from('prices').insert(pr); if (e.error) throw e.error; }
  const st = rows.map((r, i) => ({ r, i })).filter(x => x.r.stock > 0).map(x => ({
    business_id: bid, warehouse_id: S.wh, variant_id: v.data[x.i].id, qty: x.r.stock, type: 'ingreso', note: 'Stock inicial'
  }));
  if (st.length) { const e = await sb.from('stock_movements').insert(st); if (e.error) throw e.error; }
}

/* ---------- Productos ---------- */
async function prodView(q = '') {
  $('#v').innerHTML = `<input id="q" type="search" placeholder="Buscar por nombre o código" value="${esc(q)}">
    <details class="c"><summary class="t">+ Nuevo producto</summary>
      <input id="nc" placeholder="Código"><input id="nn" placeholder="Nombre">
      <input id="nk" type="number" step="any" placeholder="Costo"><select id="nm"><option value="ARS">Costo en pesos</option><option value="USD">Costo en dólares</option></select>
      ${S.lists.map(l => `<input class="np" data-l="${l.id}" type="number" step="any" placeholder="Precio ${esc(l.name)} (${l.currency})">`).join('')}
      <button id="ns">Guardar producto</button></details>
    <div id="pl" class="m">Cargando…</div>`;
  $('#q').onchange = e => prodView(e.target.value.trim());
  $('#ns').onclick = async () => {
    const name = $('#nn').value.trim();
    if (!name) return say('Falta el nombre del producto.');
    try {
      await addProducts([{
        code: $('#nc').value.trim(), name, cost: +$('#nk').value || 0, cc: $('#nm').value, pack: 1,
        prices: Object.fromEntries([...document.querySelectorAll('.np')].map(i => [i.dataset.l, i.value === '' ? '' : +i.value]))
      }]);
      say('Producto guardado.'); prodView();
    } catch (e) { say(e.code === '23505' ? 'Ya existe un producto con ese código.' : e.message); }
  };
  let r = sb.from('products').select('id,code,name,cost,cost_currency,product_variants(id,prices(price,price_list_id,min_qty))')
    .eq('business_id', S.bid).order('name').limit(100);
  if (q) { const t = q.replace(/[,()%]/g, ' '); r = r.or(`name.ilike.%${t}%,code.ilike.%${t}%`); }
  const { data, error } = await r;
  if (error) return ($('#pl').textContent = error.message);
  $('#pl').className = 'gr';
  $('#pl').innerHTML = data.length ? data.map(p => {
    const v = p.product_variants[0] || {}, pr = (v.prices || []).filter(x => x.min_qty == 1);
    const at = id => pr.find(y => y.price_list_id == id);
    const line = S.lists.map(l => at(l.id) ? `${esc(l.name)} ${mon(l.currency)}${fmt(at(l.id).price)}` : '').filter(Boolean).join('  |  ');
    return `<details class="c" data-p="${p.id}" data-v="${v.id}"><summary><div class="r"><span class="t">${esc(p.name)}</span><span class="m">${esc(p.code || '')}</span></div><div class="m">${line}</div></summary>
      <input class="en" value="${esc(p.name)}"><label class="m">Costo</label><input class="ek" type="number" step="any" value="${p.cost}"><select class="ec"><option value="ARS"${p.cost_currency == 'ARS' ? ' selected' : ''}>Costo en pesos</option><option value="USD"${p.cost_currency == 'USD' ? ' selected' : ''}>Costo en dólares</option></select>
      ${S.lists.map(l => `<label class="m">Precio ${esc(l.name)} (${l.currency})</label><input class="ep" data-l="${l.id}" type="number" step="any" value="${at(l.id) ? at(l.id).price : ''}">`).join('')}
      <button class="sv">Guardar cambios</button></details>`;
  }).join('') : '<p class="m">Todavía no hay productos. Cargá uno o importá un CSV.</p>';
  document.querySelectorAll('.sv').forEach(b => b.onclick = async () => {
    const d = b.closest('details');
    const e1 = await sb.from('products').update({ name: d.querySelector('.en').value.trim(), cost: +d.querySelector('.ek').value || 0, cost_currency: d.querySelector('.ec').value }).eq('id', d.dataset.p);
    const pr = [...d.querySelectorAll('.ep')].filter(i => i.value !== '').map(i => ({
      business_id: S.bid, price_list_id: i.dataset.l, variant_id: d.dataset.v, min_qty: 1, price: +i.value
    }));
    const e2 = pr.length ? await sb.from('prices').upsert(pr, { onConflict: 'price_list_id,variant_id,min_qty' }) : {};
    const er = e1.error || e2.error;
    S.cat = null; say(er ? er.message : 'Cambios guardados.');
    if (!er) prodView(q);
  });
}

/* ---------- Importar CSV ---------- */
function csv(t) {
  t = t.replace(/^\ufeff/, '');
  const l1 = t.split('\n')[0];
  const d = (l1.match(/;/g) || []).length > (l1.match(/,/g) || []).length ? ';' : ',';
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c == '"') { if (t[i + 1] == '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c == '"') q = true;
    else if (c == d) { row.push(f); f = ''; }
    else if (c == '\n' || c == '\r') { if (c == '\r' && t[i + 1] == '\n') i++; row.push(f); out.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); out.push(row); }
  return out.filter(r => r.some(x => x.trim()));
}
function impView() {
  const cols = ['codigo', 'nombre', 'costo', 'unidades_por_bulto', 'stock', ...S.lists.map(l => 'precio_' + l.name.toLowerCase())];
  $('#v').innerHTML = `<p class="m">Subí un archivo CSV (en Excel: Guardar como, CSV). Columnas:<br><b>${cols.join(', ')}</b><br>Solo "nombre" es obligatoria. Los precios van en la moneda de cada lista.</p>
    <button class="s" id="tp">Descargar plantilla</button><input type="file" id="f" accept=".csv,text/csv"><div id="pv" class="m"></div>`;
  $('#tp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + cols.join(',') + '\n'], { type: 'text/csv' }));
    a.download = 'plantilla_productos.csv'; a.click();
  };
  $('#f').onchange = async e => {
    const rows = csv(await e.target.files[0].text());
    const h = rows.shift().map(x => x.trim().toLowerCase());
    const ix = n => h.indexOf(n);
    if (ix('nombre') < 0) return ($('#pv').textContent = 'Falta la columna "nombre".');
    const items = rows.map(r => ({
      code: (r[ix('codigo')] || '').trim(), name: (r[ix('nombre')] || '').trim(),
      cost: num(r[ix('costo')]) || 0, stock: num(r[ix('stock')]) || 0, pack: Math.max(1, parseInt(r[ix('unidades_por_bulto')]) || 1),
      prices: Object.fromEntries(S.lists.map(l => [l.id, num(r[ix('precio_' + l.name.toLowerCase())])]))
    })).filter(x => x.name);
    let n = 0;
    try {
      for (let i = 0; i < items.length; i += 200) {
        $('#pv').textContent = `Importando ${n} de ${items.length}…`;
        const part = items.slice(i, i + 200);
        await addProducts(part); n += part.length;
      }
      $('#pv').textContent = `Listo: ${n} productos importados.`;
    } catch (err) {
      $('#pv').textContent = `Se importaron ${n}. Error: ${err.code === '23505' ? 'hay un código repetido' : err.message}`;
    }
  };
}

/* ---------- Precios ---------- */
function preView() {
  $('#v').innerHTML = `<div class="c"><b>Nueva lista de precios</b><p class="m">Por ejemplo: Precio Once, Precio Flores.</p>
      <input id="ln" placeholder="Nombre de la lista"><select id="lm"><option value="ARS">Moneda: pesos (ARS)</option><option value="USD">Moneda: dólares (USD)</option></select><select id="ls"><option value="">Empezar vacía</option>${S.lists.map(l => `<option value="${l.id}">Copiar precios de ${esc(l.name)}</option>`).join('')}</select>
      <button id="nl">Crear lista</button></div>
    <p class="m">Subí o bajá todos los precios de una lista a la vez. Escribí el porcentaje y elegí si sube o baja.</p>` +
    S.lists.map(l => `<div class="c"><b>${esc(l.name)}</b> <span class="m">${l.currency}</span>
      <input type="number" step="any" min="0" id="a${l.id}" placeholder="% de ajuste (ej: 10)">
      <div class="g"><button data-l="${l.id}" data-n="${esc(l.name)}" data-s="1">Subir</button><button class="s" data-l="${l.id}" data-n="${esc(l.name)}" data-s="-1">Bajar</button></div></div>`).join('');
  $('#nl').onclick = crearLista;
  document.querySelectorAll('#v .g button').forEach(b => b.onclick = async () => {
    const x = Math.abs(+$('#a' + b.dataset.l).value);
    if (!x) return say('Escribí un porcentaje mayor a 0.');
    const pct = x * b.dataset.s;
    if (!confirm(`¿${pct > 0 ? 'Subir' : 'Bajar'} ${x}% todos los precios de ${b.dataset.n}?`)) return;
    const { data, error } = await sb.rpc('adjust_prices', { p_price_list_id: b.dataset.l, p_pct: pct });
    S.cat = null;
    say(error ? error.message : `Se ajustaron ${data} precios.`);
  });
}

/* ---------- Catálogo compartido (stock y presupuestos) ---------- */
async function pg(mk) {
  let out = [];
  for (let f = 0; ; f += 1000) {
    const { data, error } = await mk().range(f, f + 999);
    if (error) { say(error.message); return out; }
    out = out.concat(data);
    if (data.length < 1000) return out;
  }
}
async function catalog() {
  const d = await pg(() => sb.from('product_variants').select('id,products(name,code),prices(price,price_list_id,min_qty)').eq('business_id', S.bid).order('id'));
  return (S.cat = d.map(v => ({ id: v.id, name: v.products.name, code: v.products.code || '', prices: v.prices }))
    .sort((a, b) => a.name.localeCompare(b.name)));
}
const priceOf = (v, list, q) => {
  const x = v.prices.filter(p => p.price_list_id == list && p.min_qty <= q).sort((a, b) => b.min_qty - a.min_qty)[0];
  return x ? +x.price : 0;
};
const match = (v, q) => (v.name + ' ' + v.code).toLowerCase().includes(q.toLowerCase());

async function crearLista() {
  const name = $('#ln').value.trim(), src = $('#ls').value, cur = $('#lm').value;
  if (!name) return say('Escribí el nombre de la lista.');
  const sl = S.lists.find(l => l.id == src);
  let k = 1;
  if (sl && sl.currency != cur) {
    const r = num(prompt(`Cotización del dólar (pesos por 1 USD) para convertir los precios de ${sl.name}:`));
    if (!(r > 0)) return say('Cotización inválida. No se creó la lista.');
    k = cur == 'USD' ? 1 / r : r;
  }
  const { data, error } = await sb.from('price_lists').insert({ business_id: S.bid, name, currency: cur }).select('id').single();
  if (error) return say(error.code === '23505' ? 'Ya existe una lista con ese nombre.' : error.message);
  if (src) {
    const rows = await pg(() => sb.from('prices').select('variant_id,min_qty,price').eq('price_list_id', src).order('id'));
    for (let i = 0; i < rows.length; i += 500) {
      const e = await sb.from('prices').insert(rows.slice(i, i + 500).map(x => ({
        variant_id: x.variant_id, min_qty: x.min_qty, price: Math.round(x.price * k * 100) / 100, business_id: S.bid, price_list_id: data.id
      })));
      if (e.error) return say(e.error.message);
    }
  }
  const l = await sb.from('price_lists').select('id,name,currency').eq('business_id', S.bid).order('name');
  S.lists = l.data || []; S.cat = null;
  say(`Lista "${name}" creada.`); preView();
}

/* ---------- Ventas del día + ARCA ---------- */
async function ventasView(d = new Date().toLocaleDateString('sv-SE')) {
  $('#v').innerHTML = `<input id="vd" type="date" value="${d}"><div id="vs" class="m">Cargando…</div>
    <div class="c"><b>Impuestos y declaraciones</b><p class="m">Ganancias se presenta únicamente desde el sitio de ARCA, con Clave Fiscal nivel 2 o superior (servicio "Ganancias Personas Humanas - Portal Integrado").</p>
      <a class="b" href="https://www.arca.gob.ar/gananciasybienes/" target="_blank" rel="noopener">Ganancias y Bienes Personales (ARCA)</a>
      <a class="b" href="https://www.arca.gob.ar" target="_blank" rel="noopener">Portal de ARCA</a></div>`;
  $('#vd').onchange = e => e.target.value && ventasView(e.target.value);
  const a = new Date(d + 'T00:00:00'), z = new Date(a.getTime() + 864e5);
  const { data, error } = await sb.from('sales').select('id,total,currency,created_at,customers(name),sale_items(description,qty)')
    .eq('business_id', S.bid).gte('created_at', a.toISOString()).lt('created_at', z.toISOString()).order('created_at', { ascending: false });
  if (error) return ($('#vs').textContent = error.message);
  const tot = {}, pr = {};
  data.forEach(x => { tot[x.currency] = (tot[x.currency] || 0) + +x.total; x.sale_items.forEach(i => { pr[i.description] = (pr[i.description] || 0) + +i.qty; }); });
  const tt = Object.entries(tot).map(([c, v]) => `${mon(c)}${fmt(v)}`).join('  |  ') || `${mon('ARS')}${fmt(0)}`;
  $('#vs').className = '';
  $('#vs').innerHTML = `<div class="c"><span class="m">Total del día (${data.length} ${data.length == 1 ? 'venta' : 'ventas'})</span><div class="t" style="font-size:28px">${tt}</div></div>`
    + data.map(x => `<div class="r c"><span>${new Date(x.created_at).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })} ${esc(x.customers?.name || 'Cliente ocasional')}</span><span class="t">${mon(x.currency)}${fmt(x.total)}</span></div>`).join('')
    + (data.length ? `<p class="t">Productos vendidos</p>` + Object.entries(pr).sort((u, w) => w[1] - u[1]).map(([n, q]) => `<div class="r c"><span>${esc(n)}</span><span class="t">${q}</span></div>`).join('')
      : '<p class="m">No hay ventas en esta fecha.</p>');
}

/* ---------- Stock ---------- */
async function stockView(q = '') {
  $('#v').innerHTML = `<input id="q" type="search" placeholder="Buscar producto" value="${esc(q)}"><div id="sl" class="m">Cargando…</div>`;
  $('#q').onchange = e => stockView(e.target.value.trim());
  const [cat, st] = await Promise.all([catalog(), pg(() => sb.from('stock_levels').select('variant_id,qty').eq('business_id', S.bid).order('variant_id').order('warehouse_id'))]);
  const lv = {};
  st.forEach(x => { lv[x.variant_id] = (lv[x.variant_id] || 0) + +x.qty; });
  $('#sl').className = 'gr';
  $('#sl').innerHTML = cat.filter(v => match(v, q)).slice(0, 100).map(v => {
    const n = lv[v.id] || 0;
    return `<details class="c" data-v="${v.id}" data-n="${n}"><summary><div class="r"><span class="t">${esc(v.name)}</span><span class="t"${n <= 0 ? ' style="color:#c0392b"' : ''}>${n}</span></div><div class="m">${esc(v.code)}</div></summary>
      <input type="number" step="any" min="0" placeholder="Cantidad">
      <div class="g"><button data-k="ingreso">Ingreso</button><button class="s" data-k="egreso">Egreso</button><button class="s" data-k="ajuste">Fijar total</button></div></details>`;
  }).join('') || '<p class="m">No hay productos.</p>';
  document.querySelectorAll('#sl .g button').forEach(b => b.onclick = async () => {
    const d = b.closest('details'), inp = d.querySelector('input'), x = +inp.value, k = b.dataset.k;
    if (inp.value === '' || x < 0) return say('Escribí una cantidad.');
    const qty = k == 'ingreso' ? x : k == 'egreso' ? -x : x - +d.dataset.n;
    if (!qty) return say('No hay cambios.');
    const { error } = await sb.from('stock_movements').insert({ business_id: S.bid, warehouse_id: S.wh, variant_id: d.dataset.v, qty, type: k });
    if (error) return say(error.message);
    say('Stock actualizado.'); stockView(q);
  });
}

/* ---------- Presupuestos ---------- */
async function quoView() {
  $('#v').innerHTML = `<button id="nq">Nuevo presupuesto</button><div id="ql" class="m">Cargando…</div>`;
  $('#nq').onclick = async () => {
    const d = S.lists.find(l => l.name == 'Minorista') || S.lists[0];
    const { data, error } = await sb.from('quotes').insert({ business_id: S.bid, price_list_id: d.id, currency: d.currency }).select('id').single();
    error ? say(error.message) : quoEdit(data.id);
  };
  const { data, error } = await sb.from('quotes').select('id,number,status,total,currency,customers(name)')
    .eq('business_id', S.bid).order('number', { ascending: false }).limit(50);
  if (error) return say(error.message);
  $('#ql').className = 'gr';
  $('#ql').innerHTML = data.length ? data.map(x => `<div class="c" data-q="${x.id}" style="cursor:pointer"><div class="r"><span class="t">#${x.number} ${esc(x.customers?.name || 'Cliente ocasional')}</span><span class="t">${mon(x.currency)}${fmt(x.total)}</span></div><div class="m">${x.status}</div></div>`).join('')
    : '<p class="m">Todavía no hay presupuestos.</p>';
  document.querySelectorAll('[data-q]').forEach(c => c.onclick = () => quoEdit(c.dataset.q));
}

async function quoEdit(id, q = '') {
  const [qr, ir, cu] = await Promise.all([
    sb.from('quotes').select('*').eq('id', id).single(),
    sb.from('quote_items').select('*').eq('quote_id', id).order('description'),
    sb.from('customers').select('id,name,phone').eq('business_id', S.bid).order('name')
  ]);
  if (qr.error) return say(qr.error.message);
  if (!S.cat) await catalog();
  const Q = qr.data, items = ir.data || [], cl = cu.data || [], c = cl.find(x => x.id == Q.customer_id);
  const ro = Q.status == 'convertido', dis = ro ? ' disabled' : '', M = mon(Q.currency);
  const hits = q ? S.cat.filter(v => match(v, q)).slice(0, 8) : [];
  $('#v').innerHTML = `<div class="r"><button class="s" id="bk">Volver</button><span class="t">Presupuesto #${Q.number} (${Q.status})</span></div>
    <label class="m">Lista de precios</label><select id="pl2"${dis}>${S.lists.map(l => `<option value="${l.id}"${l.id == Q.price_list_id ? ' selected' : ''}>Lista ${esc(l.name)} (${l.currency})</option>`).join('')}</select>
    <label class="m">Cliente</label><select id="cu"${dis}><option value="">Cliente ocasional (sin nombre)</option>${cl.map(x => `<option value="${x.id}"${x.id == Q.customer_id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}<option value="+">+ Nuevo cliente</option></select>
    ${ro ? '' : `<input id="sq" type="search" placeholder="Agregar producto: escribí para buscar" value="${esc(q)}">`}
    ${hits.map(v => `<button class="s" data-a="${v.id}">${esc(v.name)} (${M}${fmt(priceOf(v, Q.price_list_id, 1))})</button>`).join('')}
    <div id="it">${items.map(i => `<div class="c" data-i="${i.id}"><div class="r"><span>${esc(i.description)}</span><button class="s x"${dis}>Quitar</button></div>
      <div class="g"><input class="iq" type="number" step="any" value="${i.qty}"${dis}><input class="ip" type="number" step="any" value="${i.unit_price}"${dis}></div>
      <div class="m">Cantidad, precio unitario | Subtotal ${M}${fmt(i.line_total)}</div></div>`).join('') || '<p class="m">Buscá un producto para agregarlo.</p>'}</div>
    <label class="m">Descuento general (%)</label><input id="dc" type="number" step="any" min="0" max="100" value="${Q.discount_pct}"${dis}>
    <div class="r"><span class="t">Total</span><span class="t" style="font-size:22px">${M}${fmt(Q.total)}</span></div>
    <button class="s" id="pr">Imprimir</button>
    ${ro ? '' : `<div class="g"><button id="wa">Enviar por WhatsApp</button><button class="s" id="cv">Convertir en venta</button></div>`}`;
  const upd = async o => { const { error } = await sb.from('quotes').update(o).eq('id', id); error ? say(error.message) : quoEdit(id, q); };
  $('#bk').onclick = quoView;
  $('#pr').onclick = () => {
    const w = window.open('', '_blank');
    if (!w) return say('El navegador bloqueó la ventana. Permití las ventanas emergentes.');
    const cd = i => S.cat.find(x => x.id == i.variant_id)?.code || '';
    w.document.write(`<!doctype html><meta charset="utf-8"><title>Presupuesto ${Q.number}</title>
      <style>body{font:14px Arial,sans-serif;margin:32px;color:#111}h1{font-size:22px;margin:0 0 8px}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.n{text-align:right}.t{font-size:18px;font-weight:bold}.i td{border:0;padding:2px 0}</style>
      <h1>Presupuesto Nº ${Q.number}</h1>
      <table class="i"><tr><td>Vendedor: ${esc(S.bname)}</td><td class="n">Fecha: ${new Date(Q.created_at).toLocaleDateString('es-AR')}</td></tr>
      <tr><td>Cliente: ${esc(c ? c.name : 'Cliente ocasional')}</td><td class="n">Moneda: ${MN[Q.currency] || Q.currency}</td></tr></table>
      <table><tr><th>Código</th><th>Producto</th><th class="n">Cant.</th><th class="n">Precio unitario</th><th class="n">Precio por cantidad</th></tr>
      ${items.map(i => `<tr><td>${esc(cd(i))}</td><td>${esc(i.description)}</td><td class="n">${i.qty}</td><td class="n">${M}${fmt(i.unit_price)}</td><td class="n">${M}${fmt(i.line_total)}</td></tr>`).join('')}</table>
      <p class="n">${+Q.discount_pct ? `Subtotal ${M}${fmt(Q.subtotal)}<br>Descuento ${Q.discount_pct}%<br>` : ''}<span class="t">TOTAL ${M}${fmt(Q.total)} (${Q.currency})</span></p>`);
    w.document.close(); w.focus(); setTimeout(() => w.print(), 300);
  };
  $('#pl2').onchange = async e => {
    const l = S.lists.find(x => x.id == e.target.value);
    if (items.length && !confirm('Al cambiar la lista se recalculan los precios de los productos. ¿Seguir?')) return quoEdit(id, q);
    let miss = 0;
    for (const i of items) {
      const v = S.cat.find(x => x.id == i.variant_id);
      if (!v) continue;
      const np = priceOf(v, l.id, i.qty);
      if (!np) miss++;
      await sb.from('quote_items').update({ unit_price: np }).eq('id', i.id);
    }
    await upd({ price_list_id: l.id, currency: l.currency });
    if (miss) say(`${miss} producto(s) no tienen precio en esa lista.`);
  };
  $('#dc').onchange = e => upd({ discount_pct: Math.min(100, Math.max(0, +e.target.value || 0)) });
  $('#cu').onchange = async e => {
    let v = e.target.value || null;
    if (v == '+') {
      const n = prompt('Nombre del cliente');
      if (!n) return quoEdit(id, q);
      const ph = prompt('WhatsApp (opcional, con código de área)') || null;
      const r = await sb.from('customers').insert({ business_id: S.bid, name: n.trim(), phone: ph }).select('id').single();
      if (r.error) return say(r.error.message);
      v = r.data.id;
    }
    upd({ customer_id: v });
  };
  if (ro) return;
  $('#sq').onchange = e => quoEdit(id, e.target.value.trim());
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const v = S.cat.find(x => x.id == b.dataset.a);
    const { error } = await sb.from('quote_items').insert({ business_id: S.bid, quote_id: id, variant_id: v.id, description: v.name, qty: 1, unit_price: priceOf(v, Q.price_list_id, 1) });
    error ? say(error.message) : quoEdit(id);
  });
  document.querySelectorAll('#it [data-i]').forEach(r => {
    const iid = r.dataset.i;
    const sv = async o => { const { error } = await sb.from('quote_items').update(o).eq('id', iid); error ? say(error.message) : quoEdit(id, q); };
    r.querySelector('.iq').onchange = e => +e.target.value > 0 ? sv({ qty: +e.target.value }) : quoEdit(id, q);
    r.querySelector('.ip').onchange = e => sv({ unit_price: Math.max(0, +e.target.value || 0) });
    r.querySelector('.x').onclick = async () => { await sb.from('quote_items').delete().eq('id', iid); quoEdit(id, q); };
  });
  $('#wa').onclick = async () => {
    const t = `Presupuesto #${Q.number} - ${S.bname}\n` + items.map(i => `${i.qty} x ${i.description} - ${M}${fmt(i.line_total)}`).join('\n')
      + (+Q.discount_pct ? `\nDescuento ${Q.discount_pct}%` : '') + `\nTOTAL: ${M}${fmt(Q.total)}`;
    window.open(`https://wa.me/${(c?.phone || '').replace(/\D/g, '')}?text=${encodeURIComponent(t)}`);
    if (Q.status == 'borrador') await sb.from('quotes').update({ status: 'enviado' }).eq('id', id);
  };
  $('#cv').onclick = async () => {
    if (!items.length) return say('Agregá al menos un producto.');
    if (!confirm('¿Convertir en venta y descontar el stock?')) return;
    const { error } = await sb.rpc('convert_quote_to_sale', { p_quote_id: id, p_warehouse_id: S.wh });
    if (error) return say(error.message);
    say('Venta registrada y stock descontado.'); quoEdit(id);
  };
}

init();
</script>
